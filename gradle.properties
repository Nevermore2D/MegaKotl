# Modest JVM heaps for local Desktop/Web development.
# Increase kotlin.daemon.jvmargs to -Xmx4g or -Xmx6g on machines with enough RAM
# if production Wasm compilation still runs out of memory.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.workers.max=2
org.gradle.parallel=false
